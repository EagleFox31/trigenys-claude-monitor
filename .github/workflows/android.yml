name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trigenys-claude-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct-download Android prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/multi-account-secure-widget'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-beta.1
          APK_NAME: trigenys-claude-monitor-v0.1.0-beta.1-debug.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Trigenys Claude Monitor v0.1.0 (beta Android)" \
              --notes "Experimental debug APK for personal testing on Android. Build and unit tests passed, but login with live Claude subscriptions, token rotation and background refresh have NOT been validated on a real device. Anthropic OAuth usage endpoints are undocumented. This is not a production release."
          fi
